server {
    listen 80;
    server_name sghrl.com www.sghrl.com pma.sghrl.com we.sghrl.com;
    root /var/www/html/public;
    index index.php index.html;

    location /build/ {
        alias /var/www/html/public/build/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass webapp-prod:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;           # Important for Livewire
        fastcgi_param HTTP_X_FORWARDED_PROTO https;  # Important for Livewire
        include fastcgi_params;
    }
}