# .github/workflows/deploy.yml
name: Deploy to Hostinger VPS

on:
  push:
    branches: [ production ] # Trigger on pushes to the production branch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Create production env file
        run: |
          echo "APP_ENV=production" >> .env
          echo "APP_DEBUG=false" >> .env
          echo "APP_URL=https://${{ secrets.DOMAIN }}" >> .env
          echo "LE_EMAIL=${{ secrets.LE_EMAIL }}" >> .env
          echo "DOMAIN=${{ secrets.DOMAIN }}" >> .env
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "PMA_ALLOW_IP=${{ secrets.PMA_ALLOW_IP }}" >> .env
        
      - name: Deploy to Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          environment-variables: |
            APP_KEY=${{ secrets.APP_KEY }}
            DB_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          script: |
            
            cd /var/www/sghr-portal
             
            # Backup current state
            docker-compose -f docker-compose.prod.yml ps -q > /tmp/running-containers.backup
            
            # Pull latest changes
            git pull origin production
            
            # Build and deploy with production compose
            echo "🚀 Building and starting new containers..."
            docker-compose -f docker-compose.prod.yml up -d --build
            
            # Wait for health checks
            echo "⏳ Waiting for health checks..."
            sleep 10
            
            # Check if services are healthy
            if docker-compose -f docker-compose.prod.yml ps | grep -q "unhealthy"; then
              echo "❌ Health check failed! Rolling back..."
              docker-compose -f docker-compose.prod.yml down
              # Restore previous version
              exit 1
            else
              echo "✅ Deployment successful!"
              # Clean up old images
              docker image prune -f
            fi
            
            # Run migrations
            docker-compose -f docker-compose.prod.yml exec -T webapp php artisan migrate --force
            
            # Clean up
            docker system prune -f