services:

#traefik
  traefik:
    image: traefik:3.5.4
    container_name: traefik
    command:
    - --api.insecure=true # Enable Traefik Dashboard (for local dev)
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --entrypoints.web.address=:80
    - --entrypoints.websecure.address=:443
    - --certificatesresolvers.myresolver.acme.tlschallenge=true # For Let's Encrypt
    - --certificatesresolvers.myresolver.acme.email=your-email@example.com
    - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Dashboard port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt # Volume for Let's Encrypt certificates
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik_dashboard_router.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.traefik_dashboard_router.service=traefik_dashboard_service
      - traefik.http.services.traefik_dashboard_service.loadbalancer.server.port=8080
    networks:
      - sghr_network
# Backend laralve service
  webapp:
    container_name: webapp
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - sghr_network
    volumes:
      - .:/var/www/html
    depends_on:
      - db

# database servie
  db:
    image: mysql:8.0
    platform: 'linux/arm64/v8'
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sghr
      MYSQL_USER: sghr
      MYSQL_PASSWORD: secret
    networks:
      - sghr_network
    volumes:
      - mysql_data:/var/lib/mysql

  # phpmyadmin service
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5
    container_name: phpmyadmin
    labels:
      - traefik.enable=true
      - traefik.http.routers.phpmyadmin_router.rule=Host(`phpmyadmin.$DOMAIN`)
    environment:
      UPLOAD_LIMIT: 500M
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    restart: always
    networks:
      - sghr_network
    depends_on:
        - db

  # nginx
  nginx:
    image: nginx:alpine
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - webapp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laravel.rule=Host(`$DOMAIN`)" # Replace with your domain
      # - "traefik.http.routers.laravel.entrypoints=websecure"
      # - "traefik.http.routers.laravel.tls.certresolver=myresolver"
      - "traefik.http.services.laravel.loadbalancer.server.port=80" # Nginx port
    networks:
      - sghr_network
volumes:
  mysql_data:
    driver: local

networks:
  sghr_network:
    external: true