services:
  traefik:
    image: traefik:3.5.4
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # PROD: enable ACME only when using real DNS + email
      - --certificatesresolvers.myresolver.acme.tlschallenge=true
      - --certificatesresolvers.myresolver.acme.email=${LE_EMAIL}
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
      # DEV ONLY (do not expose publicly)
      # - --api.insecure=true
    ports:
      - "80:80"
      - "443:443"
      # DEV ONLY (remove in production)
      # - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    labels:
      - traefik.enable=true
      # If you keep the dashboard, secure it and use api@internal:
      # - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)
      # - traefik.http.routers.traefik.service=api@internal
    networks:
      - sghr_network

  webapp:
    container_name: webapp
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - sghr_network

  db:
    image: mysql:8.0
    container_name: mysql
    # REMOVE platform override (your VPS is amd64)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sghr_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5
    container_name: phpmyadmin
    environment:
      UPLOAD_LIMIT: 500M
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.http.routers.phpmyadmin.rule=Host(`phpmyadmin.${DOMAIN}`)
    depends_on:
      - db
    networks:
      - sghr_network

  nginx:
    image: nginx:alpine
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webapp
    labels:
      - traefik.enable=true
      - traefik.http.routers.laravel.rule=Host(`${DOMAIN}`)
      - traefik.http.services.laravel.loadbalancer.server.port=80
    networks:
      - sghr_network

volumes:
  mysql_data:
    driver: local
  node_modules:
  mailhog-data:
    driver: local

networks:
  sghr_network:
    external: true