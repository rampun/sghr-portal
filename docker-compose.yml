services:

#traefik
  traefik:
    image: traefik:3.5.4
    container_name: traefik
    command:
    - --api.insecure=true # Enable Traefik Dashboard (for local dev)
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --entrypoints.web.address=:80
    - --entrypoints.websecure.address=:443
    - --certificatesresolvers.myresolver.acme.tlschallenge=true # For Let's Encrypt
    - --certificatesresolvers.myresolver.acme.email=your-email@example.com
    - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Dashboard port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt # Volume for Let's Encrypt certificates
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik_dashboard_router.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.traefik_dashboard_router.service=traefik_dashboard_service
      - traefik.http.services.traefik_dashboard_service.loadbalancer.server.port=8080
    networks:
      - sghr_network
# Backend laralve service
  webapp:
    container_name: webapp
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - sghr_network
    volumes:
      - .:/var/www/html
    depends_on:
      - db
 #node 
  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: node-js
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - sghr_network
    # For development with hot reload
    ports:
      - "5173:5173"
    command: >
      sh -c "npm run dev -- --host"

# mailhog
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sghr-mailhog
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailhog_router.rule=Host(`mailhog.${DOMAIN}`)
      - traefik.http.routers.mailhog_router.service=mailhog_service
      - traefik.http.services.mailhog_service.loadbalancer.server.port=8025
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /tmp
      MH_UI_BIND_ADDR: 0.0.0.0:8025
      MH_API_BIND_ADDR: 0.0.0.0:8025
      MH_SMTP_BIND_ADDR: 0.0.0.0:1025
    volumes:
      - mailhog-data:/tmp
    networks:
        - sghr_network
    command: >
      MailHog
      -smtp-bind-addr 0.0.0.0:1025
      -ui-bind-addr 0.0.0.0:8025
      -storage maildir
      -maildir-path /tmp

# database servie
  db:
    image: mysql:8.0
    platform: 'linux/arm64/v8'
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sghr
      MYSQL_USER: sghr
      MYSQL_PASSWORD: secret
    networks:
      - sghr_network
    volumes:
      - mysql_data:/var/lib/mysql

  # phpmyadmin service
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5
    container_name: phpmyadmin
    labels:
      - traefik.enable=true
      - traefik.http.routers.phpmyadmin_router.rule=Host(`phpmyadmin.$DOMAIN`)
    environment:
      UPLOAD_LIMIT: 500M
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    restart: always
    networks:
      - sghr_network
    depends_on:
        - db

  # nginx
  nginx:
    image: nginx:alpine
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - webapp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laravel.rule=Host(`$DOMAIN`)" # Replace with your domain
      # - "traefik.http.routers.laravel.entrypoints=websecure"
      # - "traefik.http.routers.laravel.tls.certresolver=myresolver"
      - "traefik.http.services.laravel.loadbalancer.server.port=80" # Nginx port
    networks:
      - sghr_network
volumes:
  mysql_data:
    driver: local
  node_modules:
  mailhog-data:
    driver: local

networks:
  sghr_network:
    external: true