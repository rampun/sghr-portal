# docker-compose.prod.yml
services:
  traefik:
    image: traefik:3.5.4
    container_name: traefik-prod
    command:
      # Docker provider
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=sghr_network
      
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      
      # HTTP to HTTPS redirect
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      
      # Let's Encrypt
      - --certificatesresolvers.myresolver.acme.httpchallenge=true
      - --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.myresolver.acme.email=${LE_EMAIL}
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
      
      # Disable dashboard
      - --api.dashboard=false
      
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - sghr_network
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: webapp-prod
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro  # Mount .env file as read-only
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://${DOMAIN}
      - ASSET_URL=https://${DOMAIN}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE}
      - DB_USERNAME=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - TRUSTED_PROXIES=*
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sghr_network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: mysql-prod
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sghr_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx-prod
    labels:
      - "traefik.enable=true"
      # SINGLE ROUTER with ALL domains
      - "traefik.http.routers.laravel.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`) || Host(`pma.${DOMAIN}`)"
      - "traefik.http.routers.laravel.entrypoints=websecure"
      - "traefik.http.routers.laravel.tls.certresolver=myresolver"
      - "traefik.http.services.laravel.loadbalancer.server.port=80"
      # Add middleware to handle static files
      - "traefik.http.routers.laravel.middlewares=static-files"
      - "traefik.http.middlewares.static-files.headers.customrequestheaders.X-Forwarded-Proto=https"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./.docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webapp
    networks:
      - sghr_network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5
    container_name: phpmyadmin-prod
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 500M
    # REMOVED labels - phpMyAdmin is now handled by the main nginx router
    # All traffic to pma.sghrl.com will go through the main laravel router
    depends_on:
      - db
    networks:
      - sghr_network
    restart: unless-stopped

networks:
  sghr_network:
    external: true

volumes:
  mysql_data:
    driver: local